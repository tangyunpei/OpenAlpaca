[package]
name = "openalpaca_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Enables MockTransport and McpClient::disconnected_for_tests for downstream test consumers.
test-utils = []

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
reqwest.workspace = true
url.workspace = true

# MCP SDK: the client, the stdio child-process transport and the
# streamable-HTTP client over reqwest. The floor is the version taken.
rmcp = { version = "3.5.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# The stdio child is spawned through rmcp's `CommandWrap` (rmcp does not
# re-export the crate), as the leader of its own process group, so a teardown
# reaches the server's descendants too. Kept on rmcp's major so the two
# `CommandWrap`s are one type.
process-wrap = { version = "10.0.1", features = ["tokio1"] }

[dev-dependencies]
tempfile.workspace = true
# `io-util` powers the in-process duplex stub server used by the seal tests;
# `net` the loopback listener the streamable-HTTP stubs bind.
tokio = { workspace = true, features = ["test-util", "io-util", "net"] }
# The streamable-HTTP stubs (`src/transport/http_tests.rs`); `futures-util`
# builds their SSE bodies.
axum.workspace = true
futures-util.workspace = true
