[package]
name = "openalpaca_storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
directories.workspace = true
file-lock.workspace = true
base64.workspace = true
rand.workspace = true
rusqlite.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
similar.workspace = true
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-test.workspace = true

[features]
# Test builds of the crates that depend on this one turn it on through their
# [dev-dependencies], so `store::projects::register` refuses an unguarded home
# store in every test binary and in no release or `cargo run` build.
test-home-guard = []
