[package]
name = "openalpaca_connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Unified connector module for chat platforms (Telegram, iMessage, WeChat, etc.)"

[[example]]
name = "telegram"
required-features = ["telegram"]

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Enable Telegram connector
telegram = ["dep:teloxide", "dep:sha2"]
# Enable iMessage connector (macOS only)
imessage = ["dep:rusqlite", "dep:tokio-util", "dep:sha2"]
# Enable Discord connector
discord = ["dep:twilight-gateway", "dep:twilight-http", "dep:twilight-model", "dep:sha2", "dep:tokio-util", "dep:reqwest", "dep:rustls"]
# Future: WeChat connector
# wechat = []

[dependencies]
# Async runtime
tokio.workspace = true
tracing.workspace = true
async-trait = { workspace = true }
thiserror.workspace = true
arc-swap.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# Concurrent map (for pending confirmations)
dashmap.workspace = true

# Internal crates
openalpaca_api.workspace = true
openalpaca_core.workspace = true
openalpaca_storage.workspace = true

# Optional: Telegram (only when feature enabled)
teloxide = { workspace = true, optional = true }

# Optional: iMessage (only when feature enabled, macOS only)
rusqlite = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# Optional: SHA-256 hashing for attachment dedup (telegram + imessage + discord)
sha2 = { workspace = true, optional = true }

# Optional: Discord (only when feature enabled)
twilight-gateway = { workspace = true, optional = true }
twilight-http = { workspace = true, optional = true }
twilight-model = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
