[package]
name = "openalpaca_connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Unified connector module for chat platforms (Telegram, iMessage, WeChat, etc.)"

[[example]]
name = "telegram"
required-features = ["telegram"]

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
# test-home-guard: store::projects::register refuses an unguarded home store in
# this crate's test builds (storage design, Stage 1).
openalpaca_storage = { workspace = true, features = ["test-home-guard"] }
# A loopback stub of the Bot API for teloxide (A-09 (2)): crates the
# workspace already locks.
axum.workspace = true
tokio = { workspace = true, features = ["net"] }

[features]
default = []
# Enable Telegram connector
telegram = ["dep:teloxide"]
# Enable iMessage connector (macOS only)
imessage = ["dep:rusqlite"]
# Enable Discord connector
discord = ["dep:twilight-gateway", "dep:twilight-http", "dep:twilight-model", "dep:reqwest", "dep:rustls"]
# Future: WeChat connector
# wechat = []

[dependencies]
# Async runtime
tokio.workspace = true
tracing.workspace = true
async-trait = { workspace = true }
thiserror.workspace = true
arc-swap.workspace = true

# Serialization
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# Concurrent map (for pending confirmations)
dashmap.workspace = true

# CancellationToken is used unconditionally by ConnectorHandle::Plugin
tokio-util.workspace = true

# Internal crates
openalpaca_api.workspace = true
openalpaca_core.workspace = true
openalpaca_storage.workspace = true

# Optional: Telegram (only when feature enabled)
teloxide = { workspace = true, optional = true }

# Optional: iMessage (only when feature enabled, macOS only)
rusqlite = { workspace = true, optional = true }

# Optional: Discord (only when feature enabled)
twilight-gateway = { workspace = true, optional = true }
twilight-http = { workspace = true, optional = true }
twilight-model = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
