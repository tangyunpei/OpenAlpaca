[package]
name = "openalpaca_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Live steer-routing eval harness (tests/steer_routing_eval.rs): compiles the
# real LLM providers into the test binary so `openalpaca_llm::build_router`
# can serve a production llm.toml. Never enabled by default — the eval is
# additionally #[ignore]d and gated on OPENALPACA_LIVE_EVAL=1.
live-eval = ["openalpaca_llm/anthropic", "openalpaca_llm/openai", "openalpaca_llm/ollama"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
regex.workspace = true
toml.workspace = true
dashmap.workspace = true
reqwest.workspace = true
futures-util.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
blake3.workspace = true
lru.workspace = true
infer.workspace = true
urlencoding.workspace = true
shell-escape.workspace = true
openalpaca_api.workspace = true
openalpaca_llm.workspace = true
openalpaca_mcp = { path = "../openalpaca_mcp" }
openalpaca_storage.workspace = true

[dev-dependencies]
# test-utils exposes McpClient::disconnected_for_tests for the MCP bridge tests.
openalpaca_mcp = { path = "../openalpaca_mcp", features = ["test-utils"] }
tempfile.workspace = true
tracing-test.workspace = true
# test-util enables tokio::test(start_paused) for the plugin-agent poll-loop tests.
tokio = { workspace = true, features = ["test-util"] }
