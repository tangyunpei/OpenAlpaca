[package]
name = "openalpaca_llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
anthropic = ["dep:reqwest"]
openai = ["dep:reqwest"]
# Ollama is served through the OpenAI provider (its OpenAI-compatible
# `/v1` surface), so the feature brings `openai` with it.
ollama = ["openai"]
# LLM-TEST-GUARD: test builds of the crates that depend on this one turn it on
# through their [dev-dependencies], so a provider refuses Anthropic's and
# OpenAI's real hosts in the test binaries of the crates that turn it on and
# in no release, `cargo run` or sidecar build (as openalpaca_storage's
# `test-home-guard`).
test-endpoint-guard = []
# Turned on only by openalpaca_core's `live-eval`: the owner's live evals call
# the real providers on purpose, so the guard yields to it. Additive, as
# features must be: it is how a `live-eval` build switches the guard off.
live-eval = []

[dependencies]
dynosaur.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
toml.workspace = true
# An `llm.toml` write is an in-place edit, so the owner's comments, key order
# and unknown keys survive it (M3) — the same writer shape `mcp.toml` uses.
toml_edit.workspace = true

arc-swap.workspace = true
aes-gcm.workspace = true
base64.workspace = true
rand.workspace = true
uuid.workspace = true
keyring-core.workspace = true

# Streaming support
futures-util.workspace = true
bytes.workspace = true

# Optional: HTTP client (only when a provider feature is enabled)
reqwest = { workspace = true, optional = true }
# The locality test (`is_local_url`) reads a base URL with the parser
# reqwest connects by; reqwest itself is optional, and core builds this
# crate with no provider feature.
url.workspace = true

# Credential discovery + CLI backends
which.workspace = true
dashmap.workspace = true
tokio-util.workspace = true

# The native credential store per OS, exactly where keyring 4's `v1` facade
# selected each one (`keys::secret_store::native_store`).
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `net`/`io-util` are for `src/test_support.rs`'s loopback HTTP server — the
# crate has no HTTP-mock dependency and tests must never reach a real provider.
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
# Captures the one warning an unreadable tool-argument string is logged with
# (N-TOOL-5); already locked through openalpaca_core's dev-dependencies.
tracing-test.workspace = true
