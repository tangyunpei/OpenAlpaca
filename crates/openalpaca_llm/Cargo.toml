[package]
name = "openalpaca_llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
anthropic = ["dep:reqwest"]
openai = ["dep:reqwest"]
ollama = ["dep:reqwest"]
local-embeddings = ["dep:fastembed"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
toml.workspace = true

arc-swap.workspace = true
aes-gcm.workspace = true
base64.workspace = true
rand.workspace = true
uuid.workspace = true
keyring.workspace = true
directories.workspace = true
file-lock.workspace = true

# Streaming support
futures-util.workspace = true
bytes.workspace = true
pin-project-lite.workspace = true

# Optional: HTTP client (only when a provider feature is enabled)
reqwest = { workspace = true, optional = true }

# Optional: local embedding model (only when local-embeddings feature is enabled)
fastembed = { workspace = true, optional = true }

# Credential discovery + CLI backends
which.workspace = true
dashmap.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
