# MCP (Model Context Protocol) server configuration.
#
# OpenAlpaca connects to declared MCP servers at boot and exposes their tools
# in the tool registry with the namespaced name `<server>__<tool>`.
#
# All servers below are commented out by default. Uncomment and configure the
# ones you want to connect to, or add your own.

[defaults]
connect_timeout_secs = 30
request_timeout_secs = 30
max_reconnect_attempts = 3
reconnect_backoff_ms = 100

# ─── Example: Filesystem server (stdio) ───
# Requires Node.js + npx. Tools appear as `fs__read_file`, `fs__write_file`, etc.
# [servers.fs]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# ─── Example: stdio server that needs a credential ───
# `env` holds literal values. For a secret, name the variable instead: every
# `env_from` entry sets `<key>` in the child's environment to the value the
# *daemon's* `<variable>` holds, resolved when the server is spawned — the same
# indirection `bearer_env` gives an HTTP server. A variable that is not set is a
# start failure naming it, never an empty value. `openalpaca ext mcp add`
# refuses to write a literal under a credential-shaped key for this reason.
# [servers.gh]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env = { RUST_LOG = "info" }
# env_from = { GITHUB_PERSONAL_ACCESS_TOKEN = "GITHUB_MCP_TOKEN" }

# ─── Example: Remote HTTP server with bearer env ───
# [servers.brave]
# transport = "http"
# url = "https://mcp.example.com/brave/v1"
# auth = { bearer_env = "BRAVE_MCP_TOKEN" }

# ─── Example: Remote HTTP server with API key ───
# [servers.github]
# transport = "http"
# url = "https://mcp.example.com/github/v1"
# auth = { api_key_header = "X-API-Key", api_key_env = "GITHUB_MCP_TOKEN" }

# ─── Example: Remote HTTP server with an extra header that carries a secret ───
# `extra_headers` holds literal values. For a credential, name the variable
# instead: every `extra_headers_from` entry sends `<header>` with the value the
# *daemon's* `<variable>` holds, resolved when the connection is made — the same
# indirection `bearer_env` and `env_from` give. A variable that is not set is a
# start failure naming it, never an empty header. `openalpaca ext mcp add`
# refuses to write a literal `Authorization`, `Proxy-Authorization`, `Cookie` or
# `X-Api-Key` header for this reason.
# [servers.tracked]
# transport = "http"
# url = "https://mcp.example.com/tracked/v1"
# extra_headers = { "X-Client-Name" = "openalpaca" }
# extra_headers_from = { "Authorization" = "TRACKED_MCP_TOKEN" }

# ─── Example: Explicitly disabled without removing ───
# `enabled = false` is the ENABLE axis's one knob for a server: the daemon does
# not connect at boot, and toggling it at runtime (`openalpaca ext enable|disable
# mcp experimental`, or the GUI's Extensions section) writes this key and then
# loads or unloads the server — a disabled server's tools leave every surface
# and are refused at the gate. There is no per-tool switch.
# [servers.experimental]
# transport = "stdio"
# command = "./some/binary"
# enabled = false
