# LLM Router Configuration (multi-provider format)
# Supports multiple providers, key rotation, fallback chains, and cost limits.

[orchestrator]
model = "llama3"
fallback_models = []

# ── Providers ────────────────────────────────────────────────────────

[providers.ollama]
enabled = true
base_url = "http://localhost:11434/v1"

# [providers.anthropic]
# enabled = true
# strategy = "round_robin"
#
# [[providers.anthropic.keys]]
# id = "default"
# secret_env = "ANTHROPIC_API_KEY"
# tier = "tier1"
# monthly_budget = 100.0

# [providers.openai]
# enabled = true
#
# [[providers.openai.keys]]
# id = "default"
# secret_env = "OPENAI_API_KEY"

# ── Custom Models (optional, built-in defaults exist) ────────────────

# [models.my-custom-model]
# provider = "openai"
# input_price = 5.0
# output_price = 15.0
# context = 128000

# ── Fallback Chains (optional) ──────────────────────────────────────

# [fallback_chains]
# "claude-sonnet-4-5-20250929" = ["gpt-4o", "llama3"]

# ── Cost Limits (optional) ──────────────────────────────────────────

# [limits]
# max_cost_per_task = 1.0
# max_cost_per_agent = 10.0

# =====================================================================
# Legacy single-provider format (still supported via auto-detection):
#
# provider = "ollama"
# model = "llama3"
# base_url = "http://localhost:11434/v1"
# max_tokens = 4096
# =====================================================================
