[execution.agent_defaults]
max_cost = 1
max_rounds = 15
max_tool_runtime_secs = 60
max_tools_per_round = 5
confirmation_timeout_secs = 300

[execution.lead_agent_defaults]
batch_spawn_enabled = true
max_concurrent_subagents = 6
max_cost = 5
max_rounds = 18
max_tool_runtime_secs = 300
max_tools_per_round = 3

[execution.artifacts]
# Largest single artifact body `artifact_write` (and the
# `workspace_write(entry_type = "artifact")` spill) will accept, in bytes.
# Default 10485760 (10 MB) — file_write's cap, not the 50 MB upload cap:
# this content comes out of a context window.
# max_artifact_bytes = 10485760
# Versions kept per artifact under `.versions/`. On write, the oldest
# superseded version beyond this bound is pruned; the head is never pruned.
# max_versions_per_artifact = 20

[execution.context]
autocompact_buffer_ratio = 0.165
compaction_target_ratio = 0.50
# compaction_model = "claude-haiku-4-5-20251001"
min_recent_messages = 4

[orchestrator.costs]
extract_every_n_turns = 5
extract_max_daily_cost_usd = 0.25
extract_min_content_len = 20
summary_max_daily_cost_usd = 0.5
task_extract_enabled = true
task_extract_max_daily_cost_usd = 0.5
task_extract_min_content_len = 100
# summary_model = "claude-haiku-4-5-20251001"
# extraction_model = "claude-haiku-4-5-20251001"

[orchestrator.memory]
fts_jaccard_threshold = 0.4
msg_trunc_chars = 1500
prompt_recent_messages = 40
summary_max_chars = 4000
summary_min_new_older_messages = 12
supersession_distance_threshold = 1

[orchestrator.memory.decay]
half_life_days = 30
min_importance = 0.05
poll_interval_secs = 3600
soft_cap = 500

[orchestrator.prompt_budgets]
identity_budget = 300
user_profile_budget = 1000

[orchestrator.routing]
# Routing V2: everything past the deterministic tier (slash task control,
# skills, /steer) and the social fast path enters the main loop, where
# chat vs. task vs. steer is the model's tool choice
# (start_workflow / steer_workflow).
# Mid-workflow steering rail: per-workflow steering inboxes, the /steer
# prefix, the main-loop steer_workflow/queue_followup tools, and the
# lead agent's post_update/queue_followup tools. When false, no inbox
# registers and every steer path reports "no running workflow".
steering_enabled = true
# Max queued steering messages per workflow inbox. A full inbox rejects
# the push and the sender is told to queue a follow-up instead.
steering_inbox_cap = 16
# Max concurrent workflows per lane. Enforced inside start_workflow; at the
# cap the tool directs the model to steer an existing workflow or queue a
# follow-up.
max_workflows_per_lane = 3
# Auto-start the next queued `followup` item when a workflow finalizes
# (`unprocessed_steering` leftovers never auto-run — they surface once as a
# context block on the lane's next main-loop turn).
followup_autostart = true
# Budgets for the main loop (per user turn).
main_loop_max_rounds = 8
main_loop_max_tools_per_round = 4
# Main-loop tool surface: "core_union" (keyword-suggested tools + the
# core set: start_workflow, task_status, memory tools, and — on lanes
# with active workflows — steer_workflow/queue_followup; plus invoke_skill
# and every installed MCP/plugin tool whose extension is enabled) or
# "full" (the entire registry; escape hatch). Both modes drop the tools of
# a disabled extension; there is no per-tool opt-out — disable the server
# or plugin itself (`openalpaca ext disable <kind> <id>`).
tool_selection = "core_union"
# Global kill switch for cron-scheduled skills. Skills whose frontmatter sets
# invoke.cron (or invoke.mode = "scheduled" with a cron expression) are
# registered with the wake scheduler at boot and re-synced on skill
# hot-reload; each fire injects the skill's slash command as a fresh turn on
# the local user's "scheduled" lane. Set false to disable all skill cron
# jobs without editing the skills themselves.
scheduled_skills_enabled = true
# EXPERIMENTAL (§5.6c, S2) — replay resume, off by default.
# With this on, `POST /v1/tasks/{id}/action {"action":"resume"}` re-enters an
# `interrupted` run under its own id: the loop's history is rebuilt from that
# run's session-log records (its rounds and their tool results, honouring the
# newest compaction boundary) and continued with a synthetic
# `<user_interjection>` telling the model not to repeat side-effecting calls
# it already made. Nothing recorded is re-executed — a replay re-primes
# context. Leave it off unless you are exercising it: `rerun` (a new id, a
# clean start) is the trusted way to run an interrupted goal again, and a
# replay that misreads a torn log hands the model a false account of its own
# work. `resume` on a *paused* run is unaffected by this flag.
resume_enabled = false

# Session event log (~/.openalpaca/sessions/<id>/log.jsonl): the append-only
# per-turn narrative — rounds, tool calls and their payloads, steering drains,
# compaction, subagent spans. The conversation itself lives in SQLite, so a
# trim here loses loop-interior detail, never the transcript.
[orchestrator.sessions]
# Per session, counting the log segments plus the results/ spill directory and
# the snapshots/ pre-edit images. On exceed, whole oldest segments are dropped
# (never the live one) and a `log_trimmed` record names the seq range that went.
log_max_session_bytes = 268435456
# Across all sessions; archived sessions are evicted oldest-touched first and
# an active session's log is never evicted.
log_max_total_bytes = 2147483648
# Age-based sweep of archived session logs, in days. 0 disables it: size is
# for disk, age is for exposure, and the two are deliberately separate.
log_retention_days = 0
# A tool result larger than this is written once to the session's results/ and
# the model is handed a stub naming it — `read_result` pages the rest. Below it
# the result travels inline unchanged.
tool_result_inline_bytes = 32768
# Before file_write overwrites an existing workspace file, its pre-edit bytes
# are copied into the session's snapshots/. A target larger than this is not
# imaged and the write is refused rather than performed without one. Kept
# equal to file_write's own 10 MB content limit on purpose: lowering this
# reopens a band of existing files file_write would otherwise refuse to
# touch at all, purely because this tier exists.
snapshot_max_bytes = 10485760

[security]
max_input_length = 32768
auto_approve_confirmations = false

# Tool circuit breaker: after `failure_threshold` consecutive transient
# failures for an (agent, tool) pair, calls are rejected until
# `reset_timeout_secs` elapses (then one probe call is allowed).
[security.circuit_breaker]
enabled = true
failure_threshold = 5
reset_timeout_secs = 300

[server]
event_broadcaster_capacity = 64
heartbeat_interval_secs = 5
sse_keep_alive_secs = 15
wake_channel_capacity = 256

[server.chat_streams]
cleanup_interval_secs = 60
stale_timeout_secs = 30
stream_chunk_delay_ms = 30
stream_chunk_words = 3

[server.embedding_indexer]
batch_size = 50
poll_interval_secs = 30

[telemetry]
store_query_preview = true

[upload]
allowed_mime_prefixes = [
    "image/",
    "application/pdf",
    "text/",
    "audio/",
    "application/msword",
    "application/vnd.openxmlformats-officedocument.",
    "application/vnd.ms-excel",
    "application/vnd.ms-powerpoint",
    "application/vnd.apple.",
]
max_file_size_bytes = 52428800
max_files_per_message = 10
max_total_storage_bytes = 524288000

[upload.governance]
attachment_ready_poll_interval_ms = 200
attachment_ready_wait_ms = 8000
cleanup_interval_hours = 6
extraction_retry_count = 1
max_concurrent_extractions = 2
max_extracted_text_chars = 50000
max_image_dimension = 8192
orphan_grace_period_hours = 24
processing_batch_size = 5
processing_poll_interval_secs = 10

[experimental]
# Inject an ephemeral system notice into each LLM request when budget
# pressure crosses 80% of cost or rounds. Helps the model self-throttle
# instead of getting cut off mid-tool-call. Default off until validated.
ephemeral_pressure_layer = false
