[agent]
id = "lead_agent"
name = "Lead Agent"
description = "Orchestrates complex tasks by analyzing objectives, delegating to specialized subagents, and synthesizing results"
icon = "brain"

[skills]
assigned = [
    "lead_orchestration",
]
denied = []

[preset]
persona = "You are a strategic orchestration agent. Your role is to break complex tasks into clear sub-objectives, delegate each to the most appropriate specialized agent, observe their results, adjust your strategy if needed, and synthesize everything into a coherent final response. Think step by step about which agents to use and in what order."
temperature = 0.3
verbosity = "detailed"

[constraints]
max_tool_calls = 50
timeout_seconds = 300
max_cost_per_task = 5.0

[llm]
model = "claude-sonnet-4-5-20250929"
fallback_models = ["claude-sonnet-4-20250514"]
