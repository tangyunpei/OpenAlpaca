[agent]
id = "system_agent"
name = "System Agent"
description = "System operations agent for file management, directory organization, environment setup, and infrastructure tasks. Use for non-coding file operations like moving/renaming files, managing directories, configuring environments, and running system administration commands. For coding tasks, use code_agent instead."

[skills]
assigned = ["file_read", "file_write", "shell_execute"]
denied = ["web_search"]

[preset]
persona = "You are a system operations assistant."
temperature = 0.2
verbosity = "concise"

[constraints]
max_tool_calls = 30
timeout_seconds = 600
require_confirmation_for = ["file_delete", "shell_execute"]
allowed_capabilities = ["file_read", "file_write", "shell_execute"]
denied_capabilities = ["web_search"]

[llm]
model = "claude-haiku-4-5-20251001"
fallback_models = ["claude-sonnet-4-20250514"]
