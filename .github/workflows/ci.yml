name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow token reads the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Build & test (Rust)
    # Pinned: ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19
    # (actions/runner-images#14748). The label stays pinned (A-15 (b)); a newer
    # image is a hand-made commit, which reads the image's Node then.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pkg-config, for the build scripts that look a system library up
      # through it: aws-lc-sys's probes for a system AWS-LC before it
      # builds its own. Nothing links OpenSSL (teloxide is on rustls), and
      # the OS keychain no longer links dbus-1: keyring-core's Secret
      # Service store speaks D-Bus over zbus.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      # The toolchain, its profile and its components come from rust-toolchain.toml:
      # `rustup toolchain install` with no argument installs the file's toolchain
      # (rustup 1.28+), so the version is pinned in one place.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # Cargo's intermediates live in the build-dir, outside target/
      # (.cargo/config.toml, M63: ~/.cargo/build/<workspace path hash>/), and
      # rust-cache saves the workspace's target/ by itself, so the build-dir's
      # root is named as an extra directory to save and restore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.cargo/build
      # The Tauri GUI backend needs system webkit libs and a staged daemon
      # sidecar binary, so it is excluded here (validated by the gui job's
      # type check and by local builds on macOS).
      - name: Build
        run: cargo build --locked --workspace --exclude openalpaca_gui
      - name: Test
        run: cargo test --locked --workspace --exclude openalpaca_gui
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude openalpaca_gui --all-targets

  gui:
    name: Build & test (GUI frontend)
    # Pinned: ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19
    # (actions/runner-images#14748). The label stays pinned (A-15 (b)); a newer
    # image is a hand-made commit, which reads the image's Node then.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/openalpaca-gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun the root package.json's `packageManager` field pins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Test
        run: bun run test
      - name: Format check
        run: bun run format:check
      # `tsc -b && vite build` — catches bundler-only failures (bad dynamic
      # imports, Tailwind token typos) that `tsc --noEmit` cannot see.
      - name: Build
        run: bun run build

  # Seconds long: the scripts' tests, the generated docs' drift check and the
  # repository-policy guard (B-23), with no network and no cargo.
  tooling:
    name: Scripts and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The interpreter pinned here is the scripts' Python floor (DU-D3 (b)):
      # the oldest Python they promise to run on, as macOS's /usr/bin/python3
      # (3.9) runs them.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9.25"
      - name: Generated API docs are current
        run: python3 -I scripts/gen_api_docs.py --check
      - name: Script tests
        run: |
          python3 -I scripts/tests/test_gen_api_docs.py
          python3 -I scripts/tests/test_repo_policy.py
          python3 -I tasks/deps-upgrade/tools/gbase/tests/test_lockdates.py
      # Every cargo call --locked, every action at a full commit SHA with its
      # version comment, every checkout without credentials, no toolchain
      # literal, CARGO_BUILD_BUILD_DIR beside every CARGO_TARGET_DIR, and the
      # zip ignores lifted once calamine's zip 8 leaves the lock.
      - name: Repository policy
        run: python3 -I scripts/repo_policy.py

  # The only Windows job, and deliberately the smallest one: no Rust, no bun,
  # just the Pester suite for install-windows.ps1 / uninstall-windows.ps1 (and
  # package-windows.ps1's hash helpers, dot-sourced the same way). The two
  # installers are the one piece of shipped code the ubuntu jobs cannot
  # exercise at all, which is why their store root drifted away from the
  # daemon's unnoticed.
  windows-release-scripts:
    name: Test (Windows release scripts)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'6.2.0' })) {
            Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 6.2.0
          $result = Invoke-Pester -Path scripts/release/tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
