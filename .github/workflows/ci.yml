name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Build & test (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # keyring's secret-service backend links the system dbus-1 library.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Tauri GUI backend needs system webkit libs and a staged daemon
      # sidecar binary, so it is excluded here (validated by the gui job's
      # type check and by local builds on macOS).
      - name: Build
        run: cargo build --workspace --exclude openalpaca_gui
      - name: Test
        run: cargo test --workspace --exclude openalpaca_gui
      - name: Clippy
        run: cargo clippy --workspace --exclude openalpaca_gui --all-targets

  gui:
    name: Build & test (GUI frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/openalpaca-gui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Test
        run: bun run test
      - name: Format check
        run: bun run format:check
      # `tsc -b && vite build` — catches bundler-only failures (bad dynamic
      # imports, Tailwind token typos) that `tsc --noEmit` cannot see.
      - name: Build
        run: bun run build

  # The only Windows job, and deliberately the smallest one: no Rust, no bun,
  # just the Pester suite for install-windows.ps1 / uninstall-windows.ps1. They
  # are the one piece of shipped code the ubuntu jobs cannot exercise at all,
  # which is why their store root drifted away from the daemon's unnoticed.
  windows-release-scripts:
    name: Test (Windows release scripts)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $result = Invoke-Pester -Path scripts/release/tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
