name: Advisories

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well, so an advisory published against an unchanged lock still
  # turns this red. The owner answers a red run (DU-21 (a)): a lock refresh, a
  # bump, or a reasoned ignore in deny.toml (and .cargo/audit.toml) or a
  # reasoned `--ignore` below.
  schedule:
    - cron: "17 6 * * 1"

# The workflow token reads the repository and nothing else.
permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec advisories, licences and sources (cargo-deny)
    # The same pinned image as ci.yml's jobs (P01b); the label stays pinned.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml holds the policy and the reasoned ignores. The action runs
      # cargo-deny 0.20.2 in its own container, which installs the toolchain
      # rust-toolchain.toml pins before cargo reads the workspace.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace --locked
          command-arguments: advisories licenses sources

  bun:
    name: npm advisories (bun audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun the root package.json's `packageManager` field pins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      # The root bun.lock. An advisory no release can clear is ignored only as
      # `--ignore=<GHSA id>`, with its reason in a comment here (none today).
      - name: Audit
        run: bun audit
