[workspace]
members = [
    "crates/openalpaca_api",
    "crates/openalpaca_core",
    "crates/openalpaca_wake",
    "crates/openalpaca_storage",
    "crates/openalpaca_platform",
    "crates/openalpaca_platform_macos",
    "crates/openalpaca_connectors",
    "apps/openalpacad",
    "apps/openalpaca",
    "apps/openalpaca-gui/src-tauri",
]
resolver = "3"

[workspace.package]

edition = "2024"
rust-version = "1.93"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
thiserror = "2.0.11"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.138"
uuid = { version = "1.13.1", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }

tokio = { version = "1.43.0", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# daemon api (server)
axum = { version = "0.8.1", features = ["ws"] }
futures-util = { version = "0.3.31", features = ["sink"] }
tower-http = { version = "0.6.2", features = ["cors"] }

# client (CLI tail)
tokio-tungstenite = "0.26.1"

# wake
tokio-cron-scheduler = "0.13.0"
notify = "8.0.0"

# Internal Crates
openalpaca_api = { path = "crates/openalpaca_api" }
openalpaca_core = { path = "crates/openalpaca_core" }
openalpaca_storage = { path = "crates/openalpaca_storage" }
openalpaca_wake = { path = "crates/openalpaca_wake" }
openalpaca_platform = { path = "crates/openalpaca_platform" }
openalpaca_platform_macos = { path = "crates/openalpaca_platform_macos" }

# cli
clap = { version = "4.5.28", features = ["derive"] }
reqwest = { version = "0.12.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
colored = "3.0.0"
urlencoding = "2.1.3"
dialoguer = "0.11.0"
console = "0.15.10"
nix = { version = "0.29.0", features = ["signal"] }
sysinfo = "0.33.1"
log = "0.4.25"
env_logger = "0.11.6"

# storage
rusqlite = { version = "0.33.0", features = ["bundled"] }
directories = "6.0.0"
file-lock = "2.1.11"
base64 = "0.22.1"
rand = "0.9.0"
libc = "0.2.169"
tempfile = "3.16.0"

# middleware
regex = "1.11.1"

# telegram
teloxide = { version = "0.13.0", features = ["macros"] }
async-trait = "0.1.86"

# Internal Crates (continued)
openalpaca_connectors = { path = "crates/openalpaca_connectors" }
