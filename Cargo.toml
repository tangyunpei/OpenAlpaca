[workspace]
members = [
    "crates/openalpaca_api",
    "crates/openalpaca_core",
    "crates/openalpaca_wake",
    "crates/openalpaca_storage",
    "crates/openalpaca_connectors",
    "crates/openalpaca_llm",
    "crates/openalpaca_mcp",
    "crates/openalpaca_plugins",
    "apps/openalpacad",
    "apps/openalpaca",
    "apps/openalpaca-gui/src-tauri",
]
# A bare `cargo build` / `cargo test` / `cargo clippy` selects what CI selects:
# every member but the Tauri shell (`--workspace --exclude openalpaca_gui`), so
# the bare and the explicit form share one set of artifacts in target/ instead
# of compiling the shared crates twice with different feature sets. The shell
# builds when named (`cargo check -p openalpaca_gui`, with its own target dir).
default-members = [
    "crates/openalpaca_api",
    "crates/openalpaca_core",
    "crates/openalpaca_wake",
    "crates/openalpaca_storage",
    "crates/openalpaca_connectors",
    "crates/openalpaca_llm",
    "crates/openalpaca_mcp",
    "crates/openalpaca_plugins",
    "apps/openalpacad",
    "apps/openalpaca",
]
resolver = "3"

[workspace.package]

edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.101"
thiserror = "2.0.18"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# SKILL.md frontmatter. Replaces the archived serde_yaml 0.9: maintained, pure
# Rust, and set as close to serde_yaml's reading as its options go
# (`yaml_options` in openalpaca_core::middleware::skill).
serde-saphyr = "2.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }

tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
    "fs",
    "process",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-test = "0.2"

# daemon api (server)
axum = { version = "0.8.8", features = ["ws", "multipart"] }
futures-util = { version = "0.3.31", features = ["sink"] }
tower-http = { version = "0.7.1", features = ["cors"] }
# Dev-only: `ServiceExt::oneshot` drives a `Router` in the daemon's route tests.
tower = { version = "0.5.3", features = ["util"] }

# client (CLI tail)
tokio-tungstenite = "0.30.0"

# wake
tokio-cron-scheduler = "0.15.1"
notify = "8.0.0"

# Internal Crates
openalpaca_api = { path = "crates/openalpaca_api" }
openalpaca_core = { path = "crates/openalpaca_core" }
openalpaca_storage = { path = "crates/openalpaca_storage" }
openalpaca_wake = { path = "crates/openalpaca_wake" }

# cli
clap = { version = "4.5.57", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
url = { version = "2", features = ["serde"] }
mime_guess = "2"
colored = "3.1.1"
urlencoding = "2.1.3"
shell-escape = "0.1.5"
dialoguer = "0.12.0"
console = "0.16.2"
nix = { version = "0.31.1", features = ["signal"] }
sysinfo = "0.39.6"

# storage
rusqlite = { version = "0.40.2", features = ["bundled"] }
directories = "6.0.0"
file-lock = "2.1.11"
base64 = "0.23.1"
rand = "0.10.0"
libc = "0.2.180"
tempfile = "3.24.0"
# Already vendored transitively (pdf-extract → openalpacad); promoted to a
# direct dependency for the artifact-grammar slugifier's NFKD step (store/artifact.rs).
unicode-normalization = "0.1.25"
# The artifact store's line diff: the write-time added/removed counts and the
# unified patch `GET /v1/artifacts/{id}/diff` serves both come out of one
# `TextDiff`, so the two can never disagree. Pure Rust, no build script,
# no non-optional dependencies, default features only (`std` + `text`).
similar = "3.2.0"

# config
toml = "1.1.8"
# Format-preserving TOML editing for the atomic config writer
# (openalpaca_core::config_io) — every comment in a hand-authored file survives.
toml_edit = "0.25"
dashmap = "6"
which = "8"
tokio-util = { version = "0.7", features = ["rt"] }
rustyline = "18.0.1"

# middleware
regex = "1.12.3"

# telegram
# teloxide over rustls with the OS root store, not native-tls (OpenSSL on
# Linux): its default features minus `native-tls`. Its rustls features go
# through reqwest 0.12's `__rustls-ring`, so `ring` stays compiled for it.
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls-native-roots"] }
async-trait = "0.1.89"

# discord (twilight ecosystem)
# twilight-gateway without its default `zstd` transport compression: its
# zstd-safe 7.x carries RUSTSEC-2026-0398 and -0403, fixed only in zstd-safe 8.2,
# which no twilight release requires; the gateway then receives plain JSON text.
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-platform-verifier", "twilight-http"] }
twilight-http = "0.17"
twilight-model = "0.17"

# TLS: one rustls crypto provider in the process, aws-lc-rs — the one reqwest
# 0.13's `rustls` feature brings. The daemon installs it as the process default
# at start (apps/openalpacad/src/tls.rs); no manifest of ours names `ring`.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }

openalpaca_llm = { path = "crates/openalpaca_llm" }
openalpaca_plugins = { path = "crates/openalpaca_plugins" }
arc-swap = "1"
signal-hook = "0.4.3"
aes-gcm = "0.11.1"
bytes = "1"
sha2 = "0.11.1"
blake3 = "1.5"
lru = "0.18.5"
infer = "0.22.0"
pdf-extract = "0.12.1"
# The daemon's own archive reads (DOCX, PPTX, iWork); `deflate` only, the one
# method OOXML and iWork use (DU-7). calamine 0.37 requires zip ^9.0 with no
# default features and `deflate`, so its reads share this one zip.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
calamine = "0.37.0"
# The OS keychain: keyring-core's `Entry` API over the native store per OS —
# the stores and options keyring 4's `v1` facade selected, so every item keeps
# its address. openalpaca_llm declares each store for its own target and owns
# the store it builds entries against (`keys::secret_store`).
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = "1.1"
# `crypto-rust`: secret-service refuses to compile without a crypto feature.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
opener = "0.9.0"
tauri = "~2.12"
tauri-build = "~2.7"
tauri-plugin-dialog = "=2.8.3"

# Internal Crates (continued)
openalpaca_connectors = { path = "crates/openalpaca_connectors" }

# `cargo test` uses the `test` profile, which inherits from `dev`, so these
# settings cover both builds and tests. Workspace crates keep file:line info
# for readable backtraces; external dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
