[workspace]
members = [
    "crates/openalpaca_api",
    "crates/openalpaca_core",
    "crates/openalpaca_wake",
    "crates/openalpaca_storage",
    "crates/openalpaca_platform",
    "crates/openalpaca_platform_macos",
    "apps/openalpacad",
    "apps/openalpaca",
    "apps/openalpaca-gui/src-tauri",
]
resolver = "3"

[workspace.package]

edition = "2024"
rust-version = "1.93"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# daemon api (server)
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
tower-http = { version = "0.5", features = ["cors"] }

# client (CLI tail)
tokio-tungstenite = "0.28"

# wake
tokio-cron-scheduler = "0.15"
notify = "8"

# Internal Crates
openalpaca_api = { path = "crates/openalpaca_api" }
openalpaca_core = { path = "crates/openalpaca_core" }
openalpaca_storage = { path = "crates/openalpaca_storage" }
openalpaca_wake = { path = "crates/openalpaca_wake" }
openalpaca_platform = { path = "crates/openalpaca_platform" }
openalpaca_platform_macos = { path = "crates/openalpaca_platform_macos" }

# storage
rusqlite = { version = "0.38", features = ["bundled"] }
directories = "6"
file-lock = "2"
base64 = "0.22"
rand = "0.9"
