[workspace]
members = [
  "crates/openalpaca_api",
  "crates/openalpaca_core",
  "crates/openalpaca_wake",
  "crates/openalpaca_storage",
  "crates/openalpaca_platform",
  "crates/openalpaca_platform_macos",
  "apps/openalpacad",
  "apps/openalpaca",
  "apps/openalpaca-gui/src-tauri",
]
resolver = "3"

[workspace.package]
name = "openalpaca-workspace"
edition = "2024"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "0.8"
tokio-cron-scheduler = "0.15"
notify = "6"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }