[workspace]
members = [
    "crates/openalpaca_api",
    "crates/openalpaca_core",
    "crates/openalpaca_wake",
    "crates/openalpaca_storage",
    "crates/openalpaca_platform",
    "crates/openalpaca_platform_macos",
    "crates/openalpaca_connectors",
    "crates/openalpaca_llm",
    "apps/openalpacad",
    "apps/openalpaca",
    "apps/openalpaca-gui/src-tauri",
]
resolver = "3"

[workspace.package]

edition = "2024"
rust-version = "1.93"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.101"
thiserror = "2.0.18"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }

tokio = { version = "1.49.0", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
    "fs",
    "process",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# daemon api (server)
axum = { version = "0.8.8", features = ["ws", "multipart"] }
futures-util = { version = "0.3.31", features = ["sink"] }
tower-http = { version = "0.6.8", features = ["cors"] }

# client (CLI tail)
tokio-tungstenite = "0.28.0"

# wake
tokio-cron-scheduler = "0.15.1"
notify = "8.0.0"

# Internal Crates
openalpaca_api = { path = "crates/openalpaca_api" }
openalpaca_core = { path = "crates/openalpaca_core" }
openalpaca_storage = { path = "crates/openalpaca_storage" }
openalpaca_wake = { path = "crates/openalpaca_wake" }
openalpaca_platform = { path = "crates/openalpaca_platform" }
openalpaca_platform_macos = { path = "crates/openalpaca_platform_macos" }

# cli
clap = { version = "4.5.57", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
url = "2"
mime_guess = "2"
colored = "3.1.1"
urlencoding = "2.1.3"
shell-escape = "0.1.5"
dialoguer = "0.12.0"
console = "0.16.2"
nix = { version = "0.31.1", features = ["signal"] }
sysinfo = "0.38.1"
log = "0.4.29"
env_logger = "0.11.8"

# storage
rusqlite = { version = "0.38.0", features = ["bundled"] }
directories = "6.0.0"
file-lock = "2.1.11"
base64 = "0.22.1"
rand = "0.10.0"
libc = "0.2.180"
tempfile = "3.24.0"
sqlite-vec = "0.1.6"
fastembed = "4"

# config
toml = "0.9"
dashmap = "6"
which = "8"
tokio-util = { version = "0.7", features = ["rt"] }
rustyline = "17"

# middleware
regex = "1.12.3"

# telegram
teloxide = { version = "0.17.0", features = ["macros"] }
async-trait = "0.1.89"

openalpaca_llm = { path = "crates/openalpaca_llm" }
arc-swap = "1"
signal-hook = "0.4.3"
aes-gcm = "0.10"
sha2 = "0.10"
infer = "0.16"
pdf-extract = "0.8"
zip = "2"
calamine = "0.26"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
opener = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Internal Crates (continued)
openalpaca_connectors = { path = "crates/openalpaca_connectors" }
