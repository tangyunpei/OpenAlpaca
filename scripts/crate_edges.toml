# The workspace's internal crate edges (B-25), checked by scripts/crate_edges.py
# against `cargo metadata --locked --format-version 1 --no-deps`: run
# `python3.11 -I scripts/crate_edges.py` from the root. One table per member, a leaf
# too, under its package name; the three kinds kept apart, each an array of the
# workspace crates that member's manifest names under that kind. An edge changes
# by changing this table in the same commit as the manifest. CLAUDE.md's
# Dependency Graph block shows the `dependencies` arrays and is kept to them by hand.
# Recorded as the tree stands after Q06 (the shell names openalpaca_app_support only).

