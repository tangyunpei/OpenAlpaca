[package]
name = "openalpaca_gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "A Tauri App"
authors = ["you"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
directories.workspace = true
tauri-plugin-dialog.workspace = true

tauri.workspace = true
openalpaca_storage = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Q11: `tauri::test` (mock_builder, mock_context, get_ipc_response) for the
# command-layer tests; the feature adds no crate.
tauri = { workspace = true, features = ["test"] }
# test-home-guard: store::projects::register refuses an unguarded home store in
# this crate's test builds (storage design, Stage 1).
openalpaca_storage = { workspace = true, features = ["test-home-guard"] }
