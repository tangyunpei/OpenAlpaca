[package]
name = "openalpaca_gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "A Tauri App"
authors = ["you"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Q12: `net` for the liveness probe (tokio::net::TcpStream, lookup_host). It
# turns on tokio's `socket2` too, so the macOS build links socket2 0.6.5,
# already in Cargo.lock and THIRD-PARTY-NOTICES: no lock or notices change.
# Q04: `io-util` for the hand-written `GET /v1/health` (AsyncReadExt,
# AsyncWriteExt). It turns on tokio's `bytes`, already in Cargo.lock as
# tokio's dependency: no lock or notices change.
tokio = { workspace = true, features = ["net", "io-util"] }
anyhow.workspace = true
# Q13: the commands' typed refusals (`ShellError`). thiserror 2.0.21 is
# already in Cargo.lock (tauri's); the lock gains only this crate's edge.
thiserror.workspace = true
tracing.workspace = true
# Q14: the shell's log, `state/logs/gui.log` — `fmt` with `env-filter` (the
# workspace's), and through its default `tracing-log` feature the bridge for
# Tauri's `log` records. tracing-subscriber 0.3.23 is already in Cargo.lock
# (the daemon's); the lock gains only this crate's edge.
tracing-subscriber.workspace = true
tauri-plugin-dialog.workspace = true
# N-DAEMON-2: `daemon.toml`'s `[daemon.env] passthrough_keys`, read by the
# shell before it spawns the daemon. toml 1.1.8 is already in Cargo.lock (the
# daemon's, the CLI's, core's); the lock gains only this crate's edge.
toml.workspace = true

tauri.workspace = true
openalpaca_storage = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Q11: `tauri::test` (mock_builder, mock_context, get_ipc_response) for the
# command-layer tests; the feature adds no crate.
tauri = { workspace = true, features = ["test"] }
# test-home-guard: store::projects::register refuses an unguarded home store in
# this crate's test builds (storage design, Stage 1).
openalpaca_storage = { workspace = true, features = ["test-home-guard"] }
