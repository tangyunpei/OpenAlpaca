[package]
name = "openalpaca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true

# CLI
clap.workspace = true
reqwest = { workspace = true, features = ["stream", "multipart"] }
mime_guess.workspace = true
colored.workspace = true
urlencoding.workspace = true
dialoguer.workspace = true
console.workspace = true
nix.workspace = true
sysinfo.workspace = true
rustyline.workspace = true

# Workspace crates
openalpaca_storage = { workspace = true }
openalpaca_llm = { workspace = true }
openalpaca_core = { workspace = true }
toml.workspace = true
uuid.workspace = true
# `openalpaca persona edit`'s editor round trip: the edited text lives in a
# named temp file that is kept on a 409 (memory redesign, plan 3.4).
tempfile.workspace = true

[dev-dependencies]
# test-home-guard: store::projects::register refuses an unguarded home store in
# this crate's test builds (storage design, Stage 1).
openalpaca_storage = { workspace = true, features = ["test-home-guard"] }
