[package]
name = "yamlcmp"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: it lives inside the repository tree but is not a member
# of its workspace. Build it with `--manifest-path`.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The library the tree reads SKILL.md frontmatter with today, and the one P30
# replaces it with (the newest 1.x on 2026-10-11), side by side in one binary.
serde_yaml = "=0.9.34"
serde-saphyr = "=1.3.0"
