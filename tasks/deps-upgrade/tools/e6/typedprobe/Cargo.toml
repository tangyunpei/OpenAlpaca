[package]
name = "typedprobe"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: it lives inside the repository tree but is not a member
# of its workspace. Build a scratch copy of it with `--manifest-path`, beside
# a copy of the checkout's `Cargo.lock` so the tree's crates resolve to the
# versions the daemon is built with, and its three path lines pointed at the
# checkout (../README.md, *Build*).
[workspace]

[dependencies]
# The tree's own loaders, by path, from this checkout.
openalpaca_core = { path = "../../../../../crates/openalpaca_core" }
openalpaca_llm = { path = "../../../../../crates/openalpaca_llm" }
openalpaca_plugins = { path = "../../../../../crates/openalpaca_plugins" }
# The same major the workspace holds (`Cargo.toml` `toml = "0.9"`); the copied
# lock pins it to the workspace's exact version. Moves with P29.
toml = "0.9"
serde_json = "1"
