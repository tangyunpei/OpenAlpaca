[package]
name = "typedprobe"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: it lives inside the repository tree but is not a member
# of its workspace. Build a scratch copy of it with `--manifest-path`, beside
# a copy of the probed tree's `Cargo.lock` so that tree's crates resolve to the
# versions its daemon is built with, and its three path lines pointed at that
# tree — the branch point's checkout, then the prep tree (../README.md, *Build*).
[workspace]

[dependencies]
# The tree's own loaders, by path, from this checkout (the recipe's scratch copy
# points them at the probed tree).
openalpaca_core = { path = "../../../../../crates/openalpaca_core" }
openalpaca_llm = { path = "../../../../../crates/openalpaca_llm" }
openalpaca_plugins = { path = "../../../../../crates/openalpaca_plugins" }
# The same major the workspace holds (`Cargo.toml` `toml = "0.9"`); the copied
# lock pins it to the workspace's exact version. The README's recipe replaces
# this line with the tree's own workspace line (`toml = "1.1"` in the prep tree,
# review F-08), so the probe's direct `toml` calls follow the tree's loaders.
toml = "0.9"
serde_json = "1"
