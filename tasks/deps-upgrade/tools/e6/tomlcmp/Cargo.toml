[package]
name = "tomlcmp"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: it lives inside the repository tree but is not a member
# of its workspace. Build it with `--manifest-path`.
[workspace]

[dependencies]
# The two versions under comparison, side by side in one binary (different
# majors, so cargo allows both): what the tree holds today, and what P29 moves
# to — the newest 1.1 release at least 7 days old on 2026-10-11 (1.1.7 and
# 1.1.8 are from 2026-10-08/09).
toml09 = { package = "toml", version = "=0.9.12" }
toml11 = { package = "toml", version = "=1.1.6" }
