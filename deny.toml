# cargo-deny's policy (P34; DU-21 (a), B-22 (b)). There is no remote CI (the
# owner, 2026-11-06): it is read locally, by hand, from the root:
#   cargo deny --locked --all-features --workspace check advisories licenses sources
# A red run is the owner's to answer (DU-21 (a)): on an unchanged lock it is a
# new advisory, answered by a lock refresh, a bump or a reasoned ignore below;
# on a change that moved the lock it belongs to that change. No check here is
# a bans check.

[advisories]
# A yanked version in Cargo.lock fails the check.
yanked = "deny"
# Unmaintained and unsound advisories fail for a crate a workspace member
# depends on directly; on a transitive crate cargo-deny passes them over
# (cargo-audit lists them as warnings) — they are an upstream's to answer
# (programme-plan §7: read the transitive unmaintained list once a year).
unmaintained = "workspace"
unsound = "workspace"
# Every ignore names why it is safe to carry and what lifts it. The same ids
# are cargo-audit's (.cargo/audit.toml).
# P34's three, on calamine 0.36.1's own zip 8.6.0, were lifted when calamine
# 0.37 moved to zip ^9.
#
# RUSTSEC-2026-0543: chrono 0.4.45 is flagged unmaintained (not vulnerable;
# all versions, no patched release, and 0.4.45 is the newest). Eight members
# name chrono directly, and rmcp, teloxide-core and tokio-cron-scheduler bring
# it in whatever the workspace does. The owner accepted it on 2026-11-17
# until the workspace moves off chrono, which he tied to the openalpaca_wake
# rework. Lifted when no workspace manifest (a member's, or the root's
# [workspace.dependencies]) names chrono: scripts/repo_policy.py's `chrono`
# rule then fails until this ignore goes.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; accepted 2026-11-17 until the workspace moves off chrono" },
]

[licenses]
# Each licence a crate in Cargo.lock needs, by name, and nothing more: a crate
# whose licence expression these do not satisfy fails, and its pull request
# allows the licence here by name with its reason, or refuses the crate
# (programme-plan §7, the per-PR checklist's (8)). The workspace's own crates
# are MIT (`[workspace.package] license`) and checked like the rest.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# A licence allowed for one crate only, not the workspace: MIT-0 (MIT No
# Attribution, OSI-approved) for borrow-or-share, which jsonschema brings in
# (referencing -> fluent-uri -> borrow-or-share, none optional; M82). Not in
# `allow`, so no other crate and no JavaScript package gains it.
exceptions = [
    { crate = "borrow-or-share", allow = ["MIT-0"] },
]
confidence-threshold = 0.8

[sources]
# crates.io only: a git or another registry's dependency fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
